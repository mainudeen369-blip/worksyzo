# Worksyzo — Render Blueprint (API + document ingest worker)
# Dashboard: New → Blueprint → connect github.com/mainudeen369-blip/worksyzo

previewsEnabled: false

services:
  - type: web
    name: worksyzo-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build:packages && npm run build -w @worksyzo/api
    startCommand: npm run start -w @worksyzo/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        value: https://worksyzo.vercel.app,https://worksyzo-mainudeen369-blips-projects.vercel.app
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: STORAGE_DRIVER
        value: r2
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_CHAT_MODEL
        value: gpt-4o-mini
      - key: LLM_EMBED_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: worksyzo-worker
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build:packages && npm run build -w @worksyzo/worker
    startCommand: npm run start -w @worksyzo/worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: r2
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_CHAT_MODEL
        value: gpt-4o-mini
      - key: LLM_EMBED_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: WORKER_POLL_MS
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
